info:
  name: Patch Student (PATCH)
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/students/1"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  body:
    type: json
    data: |-
      {
        "notes": "notes updated via patch"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
