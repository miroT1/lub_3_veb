info:
  name: Get All Students (filters)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/students?page=0&size=5&sort=fullName,asc"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
    - name: sort
      value: fullName,asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
