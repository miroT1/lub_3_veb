info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "testuser1",
        "password": "qwerty123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body;

        if (res.status === 200) {
          // Убеждаемся, что ответ содержит токены
          if (data.accessToken && data.refreshToken) {
            // Сохраняем токены в переменные окружения
            bru.setEnvVar("accessToken", data.accessToken);
            bru.setEnvVar("refreshToken", data.refreshToken);
            console.log("✅ Токены успешно сохранены в Environment");
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
