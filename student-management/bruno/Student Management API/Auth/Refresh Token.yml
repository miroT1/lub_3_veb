info:
  name: Refresh Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh-token"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body;
        if (res.status === 200) {
          bru.setEnvVar("accessToken", data.accessToken);
          bru.setEnvVar("refreshToken", data.refreshToken);
          console.log("Tokens refreshed");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
